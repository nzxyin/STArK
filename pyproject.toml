[project]
name = "tts"
version = "0.1.1"
description = "STArK: Towards Synthesizing Articulatory Kinematics from Text (Interspeech 2026)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "huggingface-hub",
    "hydra-core>=1.3.2",
    "ipykernel",
    "ipywidgets>=8.1.8",
    "librosa",
    "lightning>=2.6.0",
    "matplotlib",
    "numpy",
    "onnxruntime-gpu>=1.24.2",
    "phonemizer>=3.2.1",
    "pyyaml",
    "requests>=2.32.5",
    "rotary-embedding-torch",
    "scipy",
    "soundfile",
    "tensorboard",
    "tgt",
    "torch<2.9",
    "torchaudio<2.9",
    "torchcrepe",
    "torchmetrics>=1.8.2",
    "tqdm",
    "transformers",
    "tslearn>=0.8.0",
]

[project.optional-dependencies]
# Extra deps only needed for scripts/eval_full_testset.py's audio-quality metrics — not on the
# base install since UTMOSv2 has no PyPI release (installed straight from its GitHub repo) and
# pulls in its own largeish model-download step, neither of which regular users need.
eval = [
    "utmosv2 @ git+https://github.com/sarulab-speech/UTMOSv2.git",
]

[build-system]
requires = ["uv_build>=0.9.16,<0.10.0"]
build-backend = "uv_build"
