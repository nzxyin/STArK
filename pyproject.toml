[project]
name = "tts"
version = "0.1.1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "huggingface-hub",
    "hydra-core>=1.3.2",
    "ipykernel",
    "ipywidgets>=8.1.8",
    "librosa",
    "lightning>=2.6.0",
    "matplotlib",
    "numpy",
    "onnxruntime-gpu>=1.24.2",
    "pyyaml",
    "requests>=2.32.5",
    "rotary-embedding-torch",
    "scipy",
    "soundfile",
    "tensorboard",
    "tgt",
    "torch<2.9",
    "torchaudio<2.9",
    "torchcrepe",
    "torchmetrics>=1.8.2",
    "tqdm",
    "transformers",
    "tslearn>=0.8.0",
]

[build-system]
requires = ["uv_build>=0.9.16,<0.10.0"]
build-backend = "uv_build"
